server {
    listen       80;  # Or 80 with sudo if you want
    server_name  symf_skel_44.local;

    root   /Users/mdx/Downloads/myDocker/docker-symfony/symfony_skeleton_4_4/public;  # Your document root (create if needed: mkdir -p /opt/homebrew/var/www)
    index  index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;  # Security: prevent executing non-existent PHP
        fastcgi_pass   127.0.0.1:9073;  # Or unix:/opt/homebrew/var/run/php-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;  # Homebrew includes this file with standard params
    }
}
